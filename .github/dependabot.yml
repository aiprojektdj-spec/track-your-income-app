version: 2
updates:
  # Einzige produktive Abhaengigkeit: @vercel/blob. Die Browser-Bibliotheken in js/vendor/
  # sieht Dependabot nicht; die werden von Hand mit SHA-256 in js/vendor/VERSIONS.md gepflegt.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
