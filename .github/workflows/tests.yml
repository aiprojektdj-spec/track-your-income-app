name: Tests

# Jeder Test in test/ wird automatisch mitgenommen – ein neuer Harness braucht
# hier keinen Eintrag. Ein Test gilt als rot, wenn er mit Exit-Code != 0 endet.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Auf Commit-SHA gepinnt (Tag in Klammern), damit ein umgehaengter Tag nichts einschleust
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Kein Geheimnis im Repo: private Schluessel, bekannte Token-Formate, .env-Dateien
      - name: Secret-Scan
        run: |
          if git ls-files | grep -E '(^|/)\.env'; then echo "::error::.env-Datei im Repo"; exit 1; fi
          P='-----BEGIN [A-Z ]*PRIVATE KEY-----|vercel_blob_rw_[A-Za-z0-9]{10,}|AKIA[0-9A-Z]{16}|sk_live_[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|"role"[[:space:]]*:[[:space:]]*"service_role"|eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'
          if git grep -nIE -e "$P" -- . ':!package-lock.json' ':!js/vendor' ':!plan'; then
            echo "::error::Moegliches Geheimnis im Repo (siehe Treffer oben)"; exit 1
          fi
      - run: npm ci
      - name: Alle Tests
        run: |
          fail=0
          for f in test/*.js; do
            if ! timeout 120 node "$f" > "$RUNNER_TEMP/out.txt" 2>&1; then
              echo "::error file=$f::FAIL $f"
              cat "$RUNNER_TEMP/out.txt"
              fail=1
            fi
          done
          exit $fail
      - name: Abhaengigkeiten pruefen
        run: npm audit --omit=dev --audit-level=high
      # Prueft, dass jedes Paket aus package-lock.json wirklich vom npm-Registry signiert ist
      - name: Registry-Signaturen pruefen
        run: npm audit signatures
