<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Stackr Admin</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<main id="login" class="card" hidden>
    <h1>Stackr Admin</h1>
    <p id="login-msg"></p>
    <button id="btn-google" type="button">Mit Google anmelden</button>
    <div id="mfa" hidden>
        <p id="mfa-hint"></p>
        <img id="mfa-qr" alt="QR-Code fuer die Authenticator-App" hidden>
        <p><code id="mfa-secret"></code></p>
        <label for="mfa-code">6-stelliger Code</label>
        <input id="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
        <button id="btn-mfa" type="button">Bestaetigen</button>
    </div>
</main>

<div id="app" hidden>
    <header>
        <strong>Stackr Admin</strong>
        <nav><a href="#audit" class="active">Audit-Log</a></nav>
        <span id="who"></span>
        <button id="btn-logout" type="button">Abmelden</button>
    </header>
    <section id="view-audit">
        <h2>Audit-Log</h2>
        <form id="audit-filter">
            <label>Aktion <input name="action"></label>
            <label>Ziel-Typ <input name="targetType"></label>
            <label>Ziel-ID <input name="targetId"></label>
            <label>Von <input name="from" type="date"></label>
            <label>Bis <input name="to" type="date"></label>
            <button type="submit">Suchen</button>
        </form>
        <table>
            <thead><tr><th>Zeit</th><th>Admin</th><th>Aktion</th><th>Ziel</th><th>Aenderung</th><th>IP</th></tr></thead>
            <tbody id="audit-rows"></tbody>
        </table>
        <p id="audit-empty" hidden>Keine Eintraege fuer diese Filter.</p>
        <button id="audit-more" type="button" hidden>Aeltere laden</button>
    </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
