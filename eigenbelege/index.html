const EB = {
    getBelege:        () => JSON.parse(localStorage.getItem('eigenbelege_belege') || '[]'),
    saveBelege:       v  => localStorage.setItem('eigenbelege_belege', JSON.stringify(v)),
    getKategorien:    () => JSON.parse(localStorage.getItem('eigenbelege_kategorien') || '[]'),
    saveKategorien:   v  => localStorage.setItem('eigenbelege_kategorien', JSON.stringify(v)),

    getEinstellungen() {
        const def  = { firmenname:'', inhaberName:'', adresse:'', prefix:'EB', jahresReset:true, mwstModus:'kleinunternehmer', standardErlaeuterung:'' };
        const shared = JSON.parse(localStorage.getItem('app_einstellungen') || '{}');
        const own    = JSON.parse(localStorage.getItem('eigenbelege_einstellungen') || '{}');
        return { ...def, ...shared, ...own };
    },
    saveEinstellungen(e) {
        localStorage.setItem('eigenbelege_einstellungen', JSON.stringify(e));
        const shared = JSON.parse(localStorage.getItem('app_einstellungen') || '{}');
        if (e.firmenname)  shared.firmenname  = e.firmenname;
        if (e.inhaberName) shared.inhaberName = e.inhaberName;
        if (e.adresse)     shared.adresse     = e.adresse;
        localStorage.setItem('app_einstellungen', JSON.stringify(shared));
    },

    getNextNum() {
        const raw = localStorage.getItem('eigenbelege_naechste_nummer');
        if (!raw) return 1;
        const d = JSON.parse(raw);
        return d.year === new Date().getFullYear() ? (d.num || 1) : 1;
    },
    bumpNum() {
        const n = this.getNextNum();
        localStorage.setItem('eigenbelege_naechste_nummer',
            JSON.stringify({ year: new Date().getFullYear(), num: n + 1 }));
        return n;
    },
    peekId() {
        const s = this.getEinstellungen();
        const n = this.getNextNum();
        return `${s.prefix||'EB'}-${new Date().getFullYear()}-${String(n).padStart(3,'0')}`;
    },
    genId() {
        const s = this.getEinstellungen();
        const n = this.bumpNum();
        return `${s.prefix||'EB'}-${new Date().getFullYear()}-${String(n).padStart(3,'0')}`;
    },

    // ── Produkt-Vorlagen ──
    getProdukte: () => JSON.parse(localStorage.getItem('eigenbelege_produkte') || '[]'),
    saveProdukte: v  => localStorage.setItem('eigenbelege_produkte', JSON.stringify(v)),

    // ── Lager-Artikel aus Haupt-App lesen (synchron, Fallback) ──
    getLagerArtikel() {
        // Fallback: liest aus dem localStorage-Mirror (falls IDB nicht erreichbar)
        try {
            const mirror = localStorage.getItem('_oyi_lsmirror');
            if (mirror) {
                const data = JSON.parse(mirror);
                const key = _oyi_purchases_key();
                const purchases = JSON.parse(data[key] || data['reselling_purchases'] || '[]');
                if (purchases.length) return purchases.filter(p => !p.storniert && p.status !== 'verkauft');
            }
        } catch(e) {}
        // Legacy-Fallback
        return JSON.parse(localStorage.getItem('purchases') || '[]')
            .filter(p => !p.storniert && p.status !== 'verkauft');
    },

    // ── Lager-Artikel async aus IDB lesen (bevorzugt) ──
    async getLagerArtikelAsync() {
        try {
            const data = await OYI_IDB.get(_oyi_purchases_key());
            if (Array.isArray(data) && data.length > 0)
                return data.filter(p => !p.storniert && p.status !== 'verkauft');
        } catch(e) {}
        return this.getLagerArtikel(); // Sync-Fallback
    }
};

// ═══════════════════════════════════════════════════════════════════
// IDB-BRIDGE: direkter Zugriff auf oyi_maindata (gleiche Origin)
// Ermöglicht Eigenbelege → Lager Datenaustausch ohne gemeinsamen Store
// ═══════════════════════════════════════════════════════════════════

// Gibt den IDB-Schlüssel für Einkäufe zurück — identisch mit Store._prefix + 'purchases'.
// Wichtig: Wenn eine Firma aktiv ist, muss der Prefix übereinstimmen!
function _oyi_purchases_key() {
    const co = localStorage.getItem('oyi_active_company') || '';
    return (co ? co + '__' : '') + 'reselling_purchases';
}

const OYI_IDB = {
    _db: null,
    open() {
        return new Promise((resolve, reject) => {
            if (this._db) { resolve(this._db); return; }
            const req = indexedDB.open('oyi_maindata', 1);
            req.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('keyval'))
                    db.createObjectStore('keyval', { keyPath: 'k' });
            };
            req.onsuccess = e => { this._db = e.target.result; resolve(this._db); };
            req.onerror = () => reject(req.error);
        });
    },
    async get(key) {
        try {
            const db = await this.open();
            return await new Promise((resolve) => {
                const tx = db.transaction('keyval', 'readonly');
                const req = tx.objectStore('keyval').get(key);
                req.onsuccess = () => resolve(req.result ? JSON.parse(req.result.v || 'null') : null);
                req.onerror = () => resolve(null);
            });
        } catch(e) { return null; }
    },
    async put(key, value) {
        const db = await this.open();
        return await new Promise((resolve, reject) => {
            const tx = db.transaction('keyval', 'readwrite');
            tx.objectStore('keyval').put({ k: key, v: JSON.stringify(value) });
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(new Error('Transaktion abgebrochen'));
        });
    }
};

const euro  = n => (n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const datum = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return `${d}.${m}.${y}`; };
const today = () => new Date().toISOString().split('T')[0];
const esc   = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function getAllKat()     { return [...STD_KAT, ...EB.getKategorien()]; }

function getBegrName(id) { return BEGRUENDUNGEN.find(b=>b.id===id)?.name || id; }

function calcMwst(brutto, satz) {
    if (!satz) return { netto: brutto, mwst: 0 };
    const netto = brutto / (1 + satz/100);
    return { netto: Math.round(netto*100)/100, mwst: Math.round((brutto-netto)*100)/100 };
}

function toast(msg, type='success') {
    const colors = { success:'#10b981', danger:'#ef4444', warning:'#f59e0b', info:'#3b82f6' };
    const el = Object.assign(document.createElement('div'), { textContent: msg });
    Object.assign(el.style, {
        position:'fixed', bottom:'24px', right:'24px', zIndex:'9999',
        padding:'11px 18px', borderRadius:'8px', fontSize:'13px', fontWeight:'600',
        background: colors[type]||colors.info, color:'#fff',
        boxShadow:'0 4px 14px rgba(0,0,0,0.35)', maxWidth:'320px',
        transition:'opacity .3s'
    });
    document.body.appendChild(el);
    setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2800);
}

function renderDashboard() {
    const belege  = EB.getBelege();
    const year    = new Date().getFullYear();
    const thisYear= belege.filter(b => (b.belegDatum||'').startsWith(String(year)));

    const zwMap={}, katMap={};
    thisYear.forEach(b => {
        zwMap[b.zahlungsweg]  = (zwMap[b.zahlungsweg]  || 0) + (b.betragBrutto||0);
        katMap[b.kategorie]   = (katMap[b.kategorie]   || 0) + (b.betragBrutto||0);
    });

    const letzte = [...belege].sort((a,b)=>(b.erstelltAm||'').localeCompare(a.erstelltAm||'')).slice(0,5);

    document.getElementById('content').innerHTML = `
        <div class="page-header">
            <h2>📊 Dashboard</h2>
            <button class="btn btn-primary" onclick="navigate('neu')"><i class="ti ti-plus"></i> Neuer Eigenbeleg</button>
        </div>

        <div class="eb-warning-box" style="margin-bottom:20px">
            <div class="wb-title">⚠️ Wichtiger Hinweis zu Eigenbelegen</div>
            Eigenbelege sollten <strong>nur erstellt werden, wenn kein Originalbeleg erhältlich ist</strong>.
            Bei Betriebsprüfungen können übermäßig viele Eigenbelege zu Nachfragen führen.
            Alle Eigenbelege sind <strong>10 Jahre aufzubewahren</strong> (GoBD-Pflicht).
        </div>

        <div class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:20px">
            <div class="card stat-card">
                <div class="stat-value">${belege.length}</div>
                <div class="stat-label">Belege gesamt</div>
            </div>
            <div class="card stat-card">
                <div class="stat-value">${thisYear.length}</div>
                <div class="stat-label">In ${year}</div>
            </div>
            <div class="card stat-card" style="--accent:#8b5cf6">
                <div class="stat-value" style="color:var(--accent-light)">${euro(summe)}</div>
                <div class="stat-label">Summe ${year}</div>
            </div>
            <div class="card stat-card">
                <div class="stat-value">${thisYear.filter(b=>b.zahlungsweg==='bar').length}</div>
                <div class="stat-label">💵 Davon bar</div>
            </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px">
            <div class="card" style="padding:18px">
                <div class="card-section-title">Zahlungsweg ${year}</div>
                ${Object.keys(zwMap).length
                    ? Object.entries(zwMap).sort((a,b)=>b[1]-a[1]).map(([zw,s])=>{
                        const z=getZw(zw), pct=summe>0?Math.round(s/summe*100):0;
                        return `<div style="margin-bottom:10px">
                            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
                                <span>${z.icon} ${z.name}</span>
                                <span style="color:var(--accent-light);font-weight:600">${euro(s)}</span>
                            </div>
                            <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
                        </div>`;
                    }).join('')
                    : '<div style="color:var(--text-muted);font-size:13px">Noch keine Daten für '+year+'</div>'
                }
            </div>
            <div class="card" style="padding:18px">
                <div class="card-section-title">Nach Kategorie ${year}</div>
                ${Object.keys(katMap).length
                    ? `<div id="katChart"></div>`
                    : '<div style="color:var(--text-muted);font-size:13px">Noch keine Daten für '+year+'</div>'
                }

                </tr></thead>

                    const k=getKat(b.kategorie);
                    const vName = b.verkäufer?.name || b.empfaenger || '—';
                    return `<tr>
                        <td><span style="font-family:monospace;font-size:12px;color:var(--accent-light)">${b.id}</span></td>
                        <td style="white-space:nowrap">${datum(b.belegDatum)}</td>
                        <td>${esc(vName)}</td>
                        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.zweck||'—')}</td>
                        <td><span class="badge" style="background:${k.farbe}22;color:${k.farbe}">${k.name}</span></td>
                        <td style="text-align:right;font-weight:600">${euro(b.betragBrutto)}</td>
                        <td style="white-space:nowrap">
                            <button class="action-btn" onclick="viewBeleg('${b.id}')" title="Ansehen"><i class="ti ti-eye"></i></button>

                <button class="btn btn-primary" onclick="navigate('neu')">Ersten Eigenbeleg erstellen</button>
            </div>`}
        </div>`;

    // Chart — ApexCharts
    if (Object.keys(katMap).length) {
        if (_chartInst) { try { _chartInst.destroy(); } catch(e){} _chartInst=null; }
        const el = document.getElementById('katChart');
        if (el && typeof ApexCharts !== 'undefined') {
            const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
            const textColor = isDark ? '#94a3b8' : '#475569';
            const katKeys = Object.keys(katMap);
            _chartInst = new ApexCharts(el, {
                chart: { type:'bar', height:200, background:'transparent', toolbar:{show:false}, fontFamily:'inherit', animations:{enabled:true,speed:500} },
                theme: { mode: isDark ? 'dark' : 'light' },
                series: [{ name:'Summe', data: katKeys.map(k=>+(katMap[k].toFixed(2))) }],
                colors: katKeys.map(k=>getKat(k).farbe),
                plotOptions: { bar:{ columnWidth:'55%', borderRadius:3, distributed:true } },
                xaxis: { categories: katKeys.map(k=>getKat(k).name), labels:{style:{colors:textColor,fontSize:'10px'}}, axisBorder:{show:false}, axisTicks:{show:false} },
                yaxis: { labels:{style:{colors:textColor,fontSize:'10px'}, formatter:v=>v.toFixed(0)+'€'} },
                grid: { borderColor: isDark?'#334155':'#e2e8f0', strokeDashArray:4 },
                legend: { show:false },
                tooltip: { theme: isDark?'dark':'light', y:{ formatter:v=>euro(v) } },
                dataLabels: { enabled:false }
            });
            _chartInst.render();
        }
    }

    // GSAP stagger animation for stat cards
    if (typeof gsap !== 'undefined') {
        const cards = document.querySelectorAll('.stat-card');
        gsap.from(cards, { y:18, opacity:0, stagger:0.07, duration:0.45, ease:'power2.out', clearProps:'all' });
        cards.forEach(card => {
            const valEl = card.querySelector('.stat-value');
            if (!valEl) return;
            const raw = valEl.textContent;
            const num = parseFloat(raw.replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''));
            if (isNaN(num) || num === 0) return;
            const hasCurrency = raw.includes('€');
            const obj = { val:0 };
            gsap.to(obj, { val:num, duration:1.0, ease:'power2.out',
                onUpdate(){ valEl.textContent = hasCurrency ? obj.val.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €' : Math.round(obj.val).toLocaleString('de-DE'); },
                onComplete(){ valEl.textContent = raw; }
            });
        });
    }
}

let _foto = null;
let _warenPos = [];  // Array of { artikel, marke, zustand, menge, einzelpreis, artikelNr, lagerArtikelId }

function renderWarenPosTable() {
    if (!_warenPos.length) {
        _warenPos = [{ artikel:'', marke:'', zustand:'Nicht beurteilt', menge:1, einzelpreis:'', artikelNr:'', lagerArtikelId:null }];
    }

    // Vorlage-Chips
    const produkte = EB.getProdukte();
    const chipHtml = produkte.length ? `
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px">
            <span style="font-size:11px;font-weight:600;color:var(--text-muted)">Vorlage:</span>
            ${produkte.map(p=>`
                <button type="button" class="btn btn-small" style="border-color:var(--accent);color:var(--accent-light);"
                    onclick="applyProduktVorlage(${JSON.stringify(p).replace(/"/g,'&quot;')})">
                    ${esc(p.name)}${p.standardPreis ? ' · '+euro(p.standardPreis) : ''}
                </button>`).join('')}

    const rows = _warenPos.map((p, i) => {
        const gesamt = (parseFloat(p.menge)||0) * (parseFloat(p.einzelpreis)||0);
        const lagerBadge = p.lagerArtikelId
            ? `<span style="font-size:10px;font-family:monospace;color:var(--info);font-weight:700;cursor:pointer" onclick="clearLagerLink(${i})" title="Verknüpfung aufheben: Klicken zum Entfernen">🔗 ${esc(p.artikelNr||'Lager')} ✕</span>`
            : `<button type="button" class="btn btn-small" onclick="showLagerAuswahl(${i})" style="font-size:11px;padding:2px 7px;" title="Bestehenden Lagerartikel verknüpfen">🔗 Lager</button>`;
        return `<tr data-idx="${i}">
            <td><input class="form-control wp-artikel" data-idx="${i}" value="${esc(p.artikel)}" placeholder="Artikelbezeichnung"></td>
            <td style="width:70px"><input class="form-control wp-menge" type="number" min="0.01" step="0.01" data-idx="${i}" value="${p.menge||1}"></td>
            <td style="width:110px"><input class="form-control wp-preis" type="number" step="0.01" min="0" data-idx="${i}" value="${p.einzelpreis||''}" placeholder="0,00"></td>
            <td style="width:90px;text-align:right;font-weight:600;color:var(--accent-light)">${gesamt > 0 ? euro(gesamt) : '—'}</td>
            <td style="width:120px">${lagerBadge}</td>
            <td style="width:36px;text-align:center">${_warenPos.length > 1 ? `<button type="button" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;line-height:1" onclick="removeWarenPos(${i})">✕</button>` : ''}</td>
        </tr>`;
    }).join('');

    return `
        ${chipHtml}
        <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr style="border-bottom:1px solid var(--border)">
                <th style="padding:4px 8px 8px;text-align:left;font-size:11px;text-transform:uppercase;color:var(--text-muted)">Artikel / Beschreibung</th>
                <th style="padding:4px 8px 8px;text-align:left;font-size:11px;text-transform:uppercase;color:var(--text-muted)">Menge</th>
                <th style="padding:4px 8px 8px;text-align:left;font-size:11px;text-transform:uppercase;color:var(--text-muted)">Einzelpreis</th>
                <th style="padding:4px 8px 8px;text-align:right;font-size:11px;text-transform:uppercase;color:var(--text-muted)">Gesamt</th>
                <th style="padding:4px 8px 8px;font-size:11px;text-transform:uppercase;color:var(--text-muted)">Lager</th>
                <th></th>
            </tr></thead>
            <tbody id="warenPosBody">${rows}</tbody>
        </table>`;
}

function addWarenPos() {
    syncWarenFromDOM();
    _warenPos.push({ artikel:'', marke:'', zustand:'Nicht beurteilt', menge:1, einzelpreis:'', artikelNr:'', lagerArtikelId:null });
    refreshWarenTable();
}

function removeWarenPos(idx) {
    syncWarenFromDOM();
    _warenPos.splice(idx, 1);
    refreshWarenTable();
    recalcPositionen();
}

function refreshWarenTable() {
    const container = document.getElementById('warenPosContainer');
    if (container) container.innerHTML = renderWarenPosTable();
    bindWarenEvents();
    recalcPositionen();
}

function bindWarenEvents() {
    document.querySelectorAll('.wp-artikel').forEach(el => el.addEventListener('input', e => {
        _warenPos[+e.target.dataset.idx].artikel = e.target.value; }));
    document.querySelectorAll('.wp-menge').forEach(el => el.addEventListener('input', e => {
        _warenPos[+e.target.dataset.idx].menge = e.target.value; recalcPositionen(); }));
    document.querySelectorAll('.wp-preis').forEach(el => el.addEventListener('input', e => {
        _warenPos[+e.target.dataset.idx].einzelpreis = e.target.value; recalcPositionen(); }));
}

function recalcPositionen() {
    _warenPos.forEach((p, i) => {
        const row = document.querySelector(`#warenPosBody tr[data-idx="${i}"]`);
        if (!row) return;
        const gesamt = (parseFloat(p.menge)||0) * (parseFloat(p.einzelpreis)||0);
        const cells = row.querySelectorAll('td');
        if (cells[3]) cells[3].textContent = gesamt > 0 ? euro(gesamt) : '—';
    });
    const total = _warenPos.reduce((s,p)=>s+(parseFloat(p.menge)||0)*(parseFloat(p.einzelpreis)||0), 0);
    const wg = document.getElementById('warenGesamt');
    if (wg) wg.textContent = total > 0 ? euro(total) : '—';
    if (total > 0) {
        const bf = document.getElementById('eb-brutto');
        if (bf) { bf.value = total.toFixed(2); recalcBetrag(); }
    }
}

function applyProduktVorlage(produkt) {
    syncWarenFromDOM();
    let idx = _warenPos.findIndex(p => !p.artikel.trim());
    if (idx === -1) { _warenPos.push({ artikel:'', marke:'', zustand:'Nicht beurteilt', menge:1, einzelpreis:'', artikelNr:'', lagerArtikelId:null }); idx = _warenPos.length - 1; }
    _warenPos[idx] = { artikel: produkt.name||'', marke: produkt.marke||'', zustand: produkt.zustand||'Nicht beurteilt', menge:1, einzelpreis: produkt.standardPreis||'', artikelNr:'', lagerArtikelId:null };
    refreshWarenTable();
}

async function selectLagerArtikel(idx, artikelId) {
    const lagerList = await EB.getLagerArtikelAsync();
    const art = lagerList.find(a => a.id === artikelId);
    if (!art) return;
    _warenPos[idx].lagerArtikelId = artikelId;
    _warenPos[idx].artikelNr      = art.artikelNr || '';
    if (!_warenPos[idx].artikel.trim()) _warenPos[idx].artikel = `${art.marke||''} ${art.artikeltyp||''}`.trim();
    if (!_warenPos[idx].marke.trim())   _warenPos[idx].marke   = art.marke || '';
    refreshWarenTable();
}

function clearLagerLink(idx) {
    _warenPos[idx].lagerArtikelId = null;
    _warenPos[idx].artikelNr = '';
    refreshWarenTable();
}

}

function recalcBetrag() {
    const brutto = parseFloat(document.getElementById('eb-brutto')?.value || 0);
    const satz   = parseInt(document.getElementById('eb-mwst')?.value || 0);
    const { netto, mwst } = calcMwst(brutto, satz);
    const info = document.getElementById('betragInfo');
    if (info) info.innerHTML = `
        <span>Brutto: <strong style="color:var(--text-primary)">${euro(brutto)}</strong></span>
        <span>MwSt (${satz}%): <strong>${euro(mwst)}</strong></span>
        <span>Netto: <strong style="color:var(--accent-light)">${euro(netto)}</strong></span>`;
}

async function saveBeleg(e, editId) {
    e.preventDefault();

    const syncedPos = syncWarenFromDOM();
    const hasArtikel = syncedPos.some(p => (p.artikel||'').trim());
    if (!hasArtikel) { toast('Bitte mindestens eine Artikelbezeichnung angeben.', 'warning'); return; }

    const brutto   = parseFloat(document.getElementById('eb-brutto').value || 0);
    const mwstSatz = parseInt(document.getElementById('eb-mwst').value || 0);
    const { netto, mwst } = calcMwst(brutto, mwstSatz);
    const id  = editId || EB.genId();
    const old = editId ? EB.getBelege().find(b=>b.id===editId) : null;
    const belegDatum = document.getElementById('eb-datum').value;
    const vkName     = document.getElementById('eb-vk-name').value.trim();
    const s = EB.getEinstellungen();

    const beleg = {
        id,
        erstelltAm:         old?.erstelltAm || today(),
        belegDatum,
        zahlungsDatum:      belegDatum,
        zahlungsweg:        document.getElementById('eb-zahlungsweg').value,
        zahlungswegSonstig: '',
        zweck:              document.getElementById('eb-zweck').value,
        kategorie:          document.getElementById('eb-kat').value,
        betragBrutto:       brutto,
        mwstSatz,
        betragNetto:        netto,
        betragMwst:         mwst,
        empfaenger:         vkName,
        verkäufer: {
            name:             vkName,
            strasse:          old?.verkäufer?.strasse || '',
            plzOrt:           old?.verkäufer?.plzOrt  || '',
            land:             old?.verkäufer?.land     || 'Deutschland',
            adresseUnbekannt: false,
        },
        warenPositionen:    syncedPos,
        begruendung:        document.getElementById('eb-begr').value,
        begruendungText:    '',
        erlaeuterung:       old?.erlaeuterung || s.standardErlaeuterung || '',
        verknuepfteArtikel: old?.verknuepfteArtikel || [],
        foto:               old?.foto || _foto || null,
        aussteller:         old?.aussteller || s.inhaberName || s.firmenname || '',
        bestaetigt:         true,
        notizen:            document.getElementById('eb-notizen').value,
    };

    const belege = EB.getBelege();
    if (editId) {
        const idx = belege.findIndex(b=>b.id===editId);
        if (idx >= 0) belege[idx] = beleg; else belege.push(beleg);
    } else {
        belege.push(beleg);
    }
    EB.saveBelege(belege);
    toast(editId ? 'Eigenbeleg aktualisiert' : `Eigenbeleg ${id} gespeichert`, 'success');
    await _syncPositionenToLager(beleg); // warten bis IDB-Schreibvorgang abgeschlossen
    navigate('alle');
}

// ── Eigenbeleg → Lager: neue Positionen als Einkäufe eintragen ──
async function _syncPositionenToLager(beleg) {
    // Nur Positionen ohne vorhandenen Lager-Link und mit Artikelbezeichnung
    const newPos = (beleg.warenPositionen || []).filter(p => !p.lagerArtikelId && (p.artikel || '').trim());
    if (!newPos.length) return;

    try {
        const idbKey = _oyi_purchases_key(); // company-präfixierter Schlüssel
        const existing = (await OYI_IDB.get(idbKey)) || [];

        // Höchste vorhandene Artikelnummer ermitteln für korrekte Fortführung
        const year   = new Date().getFullYear();
        const prefix = 'ART-' + year + '-';
        let maxN = existing.reduce((max, p) => {
            const m = (p.artikelNr || '').match(/ART-\d{4}-(\d+)/);
            return m ? Math.max(max, parseInt(m[1])) : max;
        }, 0);

        const newPurchases = newPos.map(pos => {
            maxN++;
            const id = 'eb_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6);
            pos.lagerArtikelId = id;                              // Rückverweis setzen
            pos.artikelNr      = prefix + String(maxN).padStart(4, '0');
            return {
                id,
                createdAt:       new Date().toISOString(),
                _stamp:          new Date().toISOString(),
                artikelNr:       pos.artikelNr,
                datum:           beleg.belegDatum || today(),
                marke:           pos.marke || '',
                artikeltyp:      pos.artikel || '',
                groesse:         '',
                zustand:         pos.zustand || 'Nicht beurteilt',
                einkaufspreis:   parseFloat(pos.einzelpreis) || 0,
                anzahl:          parseInt(pos.menge) || 1,
                status:          'verfuegbar',
                beschreibung:    `Eigenbeleg ${beleg.id}`,
                einkaufsquelle:  beleg.verkäufer?.name || beleg.empfaenger || 'Eigenbeleg',
                eigenbeleg_id:   beleg.id,
            };
        });

        const merged = [...existing, ...newPurchases];

        // In oyi_maindata IDB schreiben — gleicher Schlüssel wie Store verwendet
        // Falls IDB fehlschlägt, wird der Fehler geworfen und im äußeren catch gefangen
        let idbOk = false;
        try {
            await OYI_IDB.put(idbKey, merged);
            idbOk = true;
        } catch(idbErr) {
            console.warn('[EB→Lager] IDB-Schreibfehler, nutze localStorage-Fallback:', idbErr);
        }

        // Lager-IDs zurück in den Beleg schreiben (für zukünftige Bearbeitungen)
        const belege = EB.getBelege();
        const bIdx   = belege.findIndex(b => b.id === beleg.id);
        if (bIdx >= 0) { belege[bIdx].warenPositionen = beleg.warenPositionen; EB.saveBelege(belege); }

        // localStorage-Mirror + direkter Store-Schlüssel — damit andere Tabs es sofort sehen
        // und als Fallback wenn IDB nicht verfügbar ist (Store._loadCacheFromLS liest diesen Key)
        try {
            const mergedStr = JSON.stringify(merged);
            const mirror = JSON.parse(localStorage.getItem('_oyi_lsmirror') || '{}');
            mirror[idbKey] = mergedStr;
            localStorage.setItem('_oyi_lsmirror', JSON.stringify(mirror));
            localStorage.setItem('_oyi_lsmirror_ts', new Date().toISOString());
            // Direkt unter dem Store-Key schreiben — Format identisch zu Store.set()
            // → wird von Store._loadCacheFromLS als Fallback gelesen falls IDB fehlt
            localStorage.setItem(idbKey, mergedStr);
        } catch(e) {}

        if (!idbOk) {
            toast('⚠️ Lager-Sync nur in localStorage gespeichert (IDB nicht verfügbar)', 'warning');
        } else {
            toast(`📦 ${newPurchases.length} Artikel ins Lager übernommen`, 'success');
        }
    } catch(e) {
        console.error('[EB→Lager Sync]', e);
        toast('⚠️ Lager-Sync fehlgeschlagen – bitte in Reselling-App prüfen', 'warning');
    }
}

function syncWarenFromDOM() {
    document.querySelectorAll('.wp-artikel').forEach(el => { _warenPos[+el.dataset.idx].artikel = el.value; });
    document.querySelectorAll('.wp-marke').forEach(el => { _warenPos[+el.dataset.idx].marke = el.value; });
    document.querySelectorAll('.wp-zustand').forEach(el => { _warenPos[+el.dataset.idx].zustand = el.value; });
    document.querySelectorAll('.wp-menge').forEach(el => { _warenPos[+el.dataset.idx].menge = parseFloat(el.value)||1; });
    document.querySelectorAll('.wp-preis').forEach(el => { _warenPos[+el.dataset.idx].einzelpreis = parseFloat(el.value)||0; });
    // lagerArtikelId + artikelNr are kept in _warenPos directly (not DOM inputs)
    return _warenPos;
}

    const name = document.getElementById('pv-name').value.trim();

        name,
        marke:         document.getElementById('pv-marke').value.trim(),
        standardPreis: parseFloat(document.getElementById('pv-preis').value) || 0,
        zustand:       document.getElementById('pv-zustand').value,
        kategorie:     document.getElementById('pv-kat').value.trim(),
        notiz:         document.getElementById('pv-notiz').value.trim(),
    };
    const produkte = EB.getProdukte();
    if (editIdx !== null && editIdx >= 0) {
        produkte[editIdx] = produkt;
    } else {
        produkte.push(produkt);
    }
    EB.saveProdukte(produkte);
    closeModal();
    toast(editIdx !== null ? 'Vorlage aktualisiert' : 'Vorlage erstellt', 'success');
    renderProdukte();
}

function editProdukt(idx)   { showProduktForm(idx); }

function deleteProdukt(idx) {
    if (!confirm('Vorlage wirklich löschen?')) return;
    const produkte = EB.getProdukte();
    produkte.splice(idx, 1);
    EB.saveProdukte(produkte);
    toast('Vorlage gelöscht', 'success');
    renderProdukte();
}

function applyFilter() {
    const g  = id => document.getElementById(id)?.value || '';
    const s  = g('f-suche').toLowerCase();
    const k  = g('f-kat');
    const zw = g('f-zw');
    const v  = g('f-von');
    const b  = g('f-bis');

    const res = EB.getBelege().filter(x => {
        const vName = (x.verkäufer?.name || x.empfaenger || '').toLowerCase();
        if (s && !x.zweck?.toLowerCase().includes(s) && !vName.includes(s)) return false;
        if (k  && x.kategorie   !== k)  return false;
        if (zw && x.zahlungsweg !== zw) return false;
        if (v  && x.belegDatum  <  v)   return false;
        if (b  && x.belegDatum  >  b)   return false;
        return true;
    }).sort((a,b) => (b.belegDatum||'').localeCompare(a.belegDatum||''));

    const tbl   = document.getElementById('belege-table');
    const foot  = document.getElementById('belege-footer');
    const total = res.reduce((a,x)=>a+(x.betragBrutto||0), 0);
    const bar   = res.filter(x=>x.zahlungsweg==='bar').reduce((a,x)=>a+(x.betragBrutto||0), 0);

    if (!res.length) {
        tbl.innerHTML  = '<div style="text-align:center;padding:40px;color:var(--text-muted)">Keine Eigenbelege gefunden.</div>';
        foot.innerHTML = '';
        return;
    }

    tbl.innerHTML = `
        <table>
            <thead><tr>
                <th>Nummer</th><th>Datum</th><th>Verkäufer</th><th>Zweck</th>
                <th>Kategorie</th><th>Zahlungsweg</th><th style="text-align:right">Betrag</th><th>Aktionen</th>
            </tr></thead>
            <tbody>
            ${res.map(x => {
                const kObj = getKat(x.kategorie);
                const zObj = getZw(x.zahlungsweg);
                const vName = x.verkäufer?.name || x.empfaenger || '—';
                return `<tr>
                    <td><span style="font-family:monospace;font-size:11px;color:var(--accent-light)">${x.id}</span></td>
                    <td style="white-space:nowrap">${datum(x.belegDatum)}</td>
                    <td>${esc(vName)}</td>
                    <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(x.zweck||'')}">${esc(x.zweck||'—')}</td>
                    <td><span class="badge" style="background:${kObj.farbe}22;color:${kObj.farbe}">${kObj.name}</span></td>
                    <td style="white-space:nowrap">${zObj.icon} ${x.zahlungsweg==='sonstiges'?(x.zahlungswegSonstig||'Sonstiges'):zObj.name}</td>
                    <td style="text-align:right;font-weight:600;white-space:nowrap">${euro(x.betragBrutto)}</td>
                    <td style="white-space:nowrap">
                        <button class="action-btn" onclick="viewBeleg('${x.id}')"   title="Ansehen"><i class="ti ti-eye"></i></button>
                        <button class="action-btn action-btn-accent" onclick="editBeleg('${x.id}')"   title="Bearbeiten"><i class="ti ti-pencil"></i></button>
                        <button class="action-btn" onclick="printBeleg('${x.id}')"  title="PDF / Drucken"><i class="ti ti-file-download"></i></button>
                        <button class="action-btn action-btn-danger" onclick="deleteBeleg('${x.id}')" title="Löschen"><i class="ti ti-trash"></i></button>
                    </td>
                </tr>`;
            }).join('')}
            </tbody>
        </table>`;

    foot.innerHTML = `<strong>${res.length} Belege</strong> &nbsp;|&nbsp;
        Gesamt: <strong style="color:var(--accent-light)">${euro(total)}</strong> &nbsp;|&nbsp;
        Bar: <strong>${euro(bar)}</strong>`;

                    <input type="color" id="kat-farbe" value="#7c3aed"

        </div>

                        <td><div style="width:18px;height:18px;border-radius:4px;background:${k.farbe};display:inline-block"></div></td>
                        <td><strong>${k.name}</strong></td>

                        <td>${cnt}</td>

function addKategorie() {
    const name = document.getElementById('kat-name')?.value?.trim();
    if (!name) { toast('Bitte einen Namen eingeben','warning'); return; }
    const farbe = document.getElementById('kat-farbe')?.value || '#7c3aed';
    const id    = name.toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,30);
    if (getAllKat().find(k=>k.id===id)) { toast('Kategorie existiert bereits','warning'); return; }
    EB.saveKategorien([...EB.getKategorien(), {id, name, farbe, std:false}]);
    toast('Kategorie hinzugefügt','success');
    renderKategorien();
}

function deleteKategorie(id) {
    if (!confirm('Kategorie löschen?')) return;
    EB.saveKategorien(EB.getKategorien().filter(k=>k.id!==id));
    toast('Kategorie gelöscht','success');
    renderKategorien();
}

        <div class="page-header"><h2>⚙️ Einstellungen</h2></div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
        <div style="display:flex;flex-direction:column;gap:16px">

            <div class="card" style="padding:18px">
                <div class="card-section-title">🏢 Firmendaten</div>
                <div class="form-group">
                    <label class="form-label">Firmenname</label>
                    <input class="form-control" id="s-firm" value="${esc(s.firmenname||'')}">
                </div>
                <div class="form-group">
                    <label class="form-label">Name des Inhabers</label>
                    <input class="form-control" id="s-name" value="${esc(s.inhaberName||'')}">
                </div>
                <div class="form-group" style="margin:0">
                    <label class="form-label">Adresse (für Beleg-Ausdruck)</label>
                    <textarea class="form-control" id="s-adresse" rows="2">${esc(s.adresse||'')}</textarea>
                </div>
            </div>

            <div class="card" style="padding:18px">
                <div class="card-section-title">🔢 Belegnummern &amp; MwSt</div>
                <div class="form-group">
                    <label class="form-label">Präfix (Standard: EB)</label>
                    <input class="form-control" id="s-prefix" value="${esc(s.prefix||'EB')}" style="max-width:120px">
                </div>
                <div class="form-group">
                    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
                        <input type="checkbox" id="s-reset" ${s.jahresReset!==false?'checked':''} style="accent-color:var(--accent)">
                        Nummerierung jährlich zurücksetzen

                <div class="form-group" style="margin:0">

                    <select class="form-control" id="s-mwst">

                        <option value="regelbesteuerung" ${s.mwstModus==='regelbesteuerung'?'selected':''}>Regelbesteuerung – Standard 19%</option>
                    </select>

            </div>

        </div>
        <div style="display:flex;flex-direction:column;gap:16px">

            <div class="card" style="padding:18px">
                <div class="card-section-title">📝 Standard-Erläuterung</div>
                <div class="form-group" style="margin:0">
                    <label class="form-label">Wird beim neuen Eigenbeleg vorausgefüllt</label>
                    <textarea class="form-control" id="s-erkl" rows="3"
                        placeholder="z.B. Ausgabe im Rahmen des gewerblichen Resellings …">${esc(s.standardErlaeuterung||'')}</textarea>

                        <input type="file" accept=".json" style="display:none" onchange="importJSON(this)">

                    <div style="border-top:1px solid var(--border);padding-top:8px">
                        <button class="btn" style="background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger)"

}

function saveEinstellungen() {
    const s = EB.getEinstellungen();
    s.firmenname          = document.getElementById('s-firm').value;
    s.inhaberName         = document.getElementById('s-name').value;
    s.adresse             = document.getElementById('s-adresse').value;
    s.prefix              = document.getElementById('s-prefix').value || 'EB';
    s.jahresReset         = document.getElementById('s-reset').checked;
    s.mwstModus           = document.getElementById('s-mwst').value;
    s.standardErlaeuterung= document.getElementById('s-erkl').value;
    EB.saveEinstellungen(s);
    toast('Einstellungen gespeichert','success');
}

// ═══════════════════════════════════════════════════════════════════
// EXPORT / IMPORT
// ═══════════════════════════════════════════════════════════════════
function exportCSV() {
    const belege = EB.getBelege();
    if (!belege.length) { toast('Keine Eigenbelege vorhanden','warning'); return; }
    const hdr = ['ID','Erstellt','Belegdatum','Zahlungsdatum','Zahlungsweg','Verkäufer','Strasse','PLZ/Ort','Zweck','Kategorie','Brutto','MwSt%','Netto','MwSt-Betrag','Begründung','Aussteller'];
    const rows = belege.map(b=>[
        b.id, b.erstelltAm, b.belegDatum, b.zahlungsDatum,
        b.zahlungsweg==='sonstiges'?b.zahlungswegSonstig:getZw(b.zahlungsweg).name,
        `"${b.verkäufer?.name || b.empfaenger||''}"`,
        `"${b.verkäufer?.strasse||''}"`,
        `"${b.verkäufer?.plzOrt||''}"`,
        `"${b.zweck||''}"`,
        getKat(b.kategorie).name,
        b.betragBrutto, b.mwstSatz, b.betragNetto, b.betragMwst,
        getBegrName(b.begruendung), `"${b.aussteller||''}"`
    ]);
    const csv = [hdr.join(';'), ...rows.map(r=>r.join(';'))].join('\n');
    dlBlob(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}), `eigenbelege_${today()}.csv`);
}

function exportJSON() {
    const data = { exportiert: new Date().toISOString(), belege: EB.getBelege(), kategorien: EB.getKategorien(), einstellungen: EB.getEinstellungen() };
    dlBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}), `eigenbelege_backup_${today()}.json`);
}

function importJSON(input) {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.belege) { toast('Ungültiges Backup-Format','danger'); return; }
            if (!confirm(`${data.belege.length} Eigenbelege importieren? Bereits vorhandene werden übersprungen.`)) return;
            const ex = new Set(EB.getBelege().map(b=>b.id));
            const neu = data.belege.filter(b=>!ex.has(b.id));
            EB.saveBelege([...EB.getBelege(),...neu]);
            if (data.kategorien?.length) {
                const exk = new Set([...STD_KAT.map(k=>k.id),...EB.getKategorien().map(k=>k.id)]);
                EB.saveKategorien([...EB.getKategorien(),...data.kategorien.filter(k=>!exk.has(k.id))]);
            }
            toast(`${neu.length} neue Belege importiert`,'success');
            navigate('alle');
        } catch(err) { toast('Fehler: '+err.message,'danger'); }
    };
    reader.readAsText(file);
}

function alleLoeschen() {
    if (!confirm('ALLE Eigenbelege unwiderruflich löschen?')) return;
    if (!confirm('Wirklich? Diese Aktion kann nicht rückgängig gemacht werden!')) return;
    EB.saveBelege([]);
    localStorage.removeItem('eigenbelege_naechste_nummer');
    toast('Alle Eigenbelege gelöscht','success');
    navigate('dashboard');
}

function dlBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'),{href:url,download:name});
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════════════════
function openModal()  { document.getElementById('modalOverlay').classList.add('active'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

// ═══════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════
const PAGES = { dashboard:renderDashboard, neu:renderNeu, alle:renderAlle, kategorien:renderKategorien, einstellungen:renderEinstellungen, vorlagen:renderProdukte };

function navigate(page) {
    document.querySelectorAll('.sidebar-link[data-page]').forEach(el =>
        el.classList.toggle('active', el.dataset.page === page));
    (PAGES[page] || renderDashboard)();
}

document.querySelectorAll('.sidebar-link[data-page]').forEach(el =>
    el.addEventListener('click', () => navigate(el.dataset.page)));

// ═══════════════════════════════════════════════════════════════════
// DARK / LIGHT MODE
// ═══════════════════════════════════════════════════════════════════
function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    const btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = t === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
}

document.getElementById('themeToggle').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    localStorage.setItem('app_theme', next);
    localStorage.setItem('theme', next);
    applyTheme(next);
});

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
applyTheme(localStorage.getItem('app_theme') || localStorage.getItem('theme') || 'dark');
navigate('dashboard');

// Theme-Sync: Änderungen aus anderen Tabs (Hauptapp etc.) sofort übernehmen
window.addEventListener('storage', e => {
    if (e.key === 'app_theme' || e.key === 'theme') applyTheme(e.newValue || 'dark');
});

// Sidebar collapse
(function() {
    const collapseBtn = document.getElementById('sidebarCollapseBtn');
    const sidebar = document.getElementById('sidebar');
    if (collapseBtn && sidebar) {
        if (localStorage.getItem('eb_sidebar_collapsed') === '1') {
            sidebar.classList.add('collapsed');
            collapseBtn.textContent = '›';
            collapseBtn.title = 'Sidebar aufklappen';
        }
        collapseBtn.addEventListener('click', () => {
            const isCollapsed = sidebar.classList.toggle('collapsed');
            collapseBtn.textContent = isCollapsed ? '›' : '‹';
            collapseBtn.title = isCollapsed ? 'Sidebar aufklappen' : 'Sidebar einklappen';
            localStorage.setItem('eb_sidebar_collapsed', isCollapsed ? '1' : '0');
        });
    }
})();
</script>
</body>
