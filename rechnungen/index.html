    <script>
        // ── GbR-Tab: show when GbR/eGbR is active ──
        (function() {
            try {
                var coId = localStorage.getItem('oyi_active_company') || '';
                var key  = (coId ? coId + '__' : '') + 'reselling_gbr_einstellungen';
                var gbr  = JSON.parse(localStorage.getItem(key) || '{}');
                if (gbr.firmenform === 'GbR' || gbr.firmenform === 'eGbR') {
                    var tab = document.getElementById('toolTabGbr');
                    if (tab) tab.style.display = '';
                }
            } catch(e) {}
        })();

        (function() {
            const btn = document.getElementById('sidebarToggleBtn');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            function close() {
                sidebar.classList.remove('sidebar-open');
                btn.classList.remove('sidebar-open');
                btn.textContent = '›'; overlay.classList.remove('active');
            }
            btn.addEventListener('click', function() {
                const open = sidebar.classList.toggle('sidebar-open');
                btn.classList.toggle('sidebar-open', open);
                btn.textContent = open ? '‹' : '›';
                overlay.classList.toggle('active', open);
            });
            overlay.addEventListener('click', close);
            sidebar.querySelectorAll('.sidebar-link').forEach(function(l) {
                l.addEventListener('click', function() { setTimeout(close, 150); });
            });
        })();
    </script>
